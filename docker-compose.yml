version: '3.8'

services:
  backend:
    build: ./Backend/flowtrack
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/flowtrack:/app
    env_file:
      - ./Backend/flowtrack/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
